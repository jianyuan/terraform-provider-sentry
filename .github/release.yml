# Categories for GitHub's auto-generated release notes.
# A PR is listed under the first category whose labels match, so order matters.
# Labels are applied automatically by .github/workflows/label-pr.yml.
changelog:
  exclude:
    labels:
      - skip-changelog
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: ⚠️ Breaking Changes
      labels:
        - breaking-change
    - title: 🚀 Features — Resources
      labels:
        - "feature: resource"
    - title: 🚀 Features — Data Sources
      labels:
        - "feature: data source"
    - title: 🚀 Features — Resources & Data Sources
      labels:
        - "feature: resource + data source"
    - title: 🚀 Features — Other
      labels:
        - enhancement
    - title: 🐛 Bug Fixes — Resources
      labels:
        - "fix: resource"
    - title: 🐛 Bug Fixes — Data Sources
      labels:
        - "fix: data source"
    - title: 🐛 Bug Fixes — Resources & Data Sources
      labels:
        - "fix: resource + data source"
    - title: 🐛 Bug Fixes — Other
      labels:
        - bug
    - title: 📚 Documentation
      labels:
        - documentation
    - title: 🔄 Sentry Data
      labels:
        - sentry-data
    - title: ⬆️ Dependencies
      labels:
        - dependencies
    - title: 🧹 Maintenance
      labels:
        - chore
    - title: Other Changes
      labels:
        - "*"
