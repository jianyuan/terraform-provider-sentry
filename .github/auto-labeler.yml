# Labels for jianyuan/auto-labeler-action, used by .github/workflows/label-pr.yml.
# Each key is a label. It applies when any matcher in its list holds; a matcher
# holds when all its conditions hold. Labels missing from the repo are skipped.
#
# Titles with a deps scope only get `dependencies`, and titles with a test(s)
# scope only get `chore`. feat and fix PRs also get a resource, data
# source, ephemeral resource and/or function label.

breaking-change:
  - title: '^\w+(\([^)]*\))?!:'
  - body: 'BREAKING[ -]CHANGE'

dependencies:
  - title: '^\w+\(deps(/[^)]*)?\)!?:'

enhancement:
  - title: &feat '^feat(\((?!deps(/|\))|tests?\))[^)]*\))?!?:'

bug:
  - title: &fix '^fix(\((?!deps(/|\))|tests?\))[^)]*\))?!?:'

documentation:
  - title: '^docs(\((?!deps(/|\))|tests?\))[^)]*\))?!?:'

chore:
  - title: '^(chore|ref|refactor|test|ci|build|perf|style)(\((?!deps(/|\)))[^)]*\))?!?:'
  - title: '^\w+\(tests?\)!?:'

# A PR gets a label for each kind it touches, from its changed files (tests
# excluded) or its scope, plus a combined label when it touches both resources and
# data sources. Release notes list it under the first matching category.
'feature: resource':
  - title: *feat
    any-file: &resource
      - internal/provider/resource_!(*_test.go)
      - sentry/resource_!(*_test.go)
      - docs/resources/**
      - examples/resources/**
  - title: &feat-res '^feat\((resource|sentry_)[^)]*\)!?:'

'feature: data source':
  - title: *feat
    any-file: &data-source
      - internal/provider/data_source_!(*_test.go)
      - sentry/data_source_!(*_test.go)
      - docs/data-sources/**
      - examples/data-sources/**
  - title: &feat-ds '^feat\(data[-_]source[^)]*\)!?:'

# Both: one matcher can hold only one any-file, so the second goes through a double not.
'feature: resource + data source':
  - title: *feat
    any-file: *resource
    not:
      not:
        any-file: *data-source
  - title: *feat-res
    any-file: *data-source
  - title: *feat-ds
    any-file: *resource

'feature: ephemeral resource':
  - title: *feat
    any-file: &ephemeral-resource
      - internal/provider/ephemeral_resource_!(*_test.go)
      - docs/ephemeral-resources/**
      - examples/ephemeral-resources/**
  - title: '^feat\(ephemeral[-_]resource[^)]*\)!?:'

'feature: function':
  - title: *feat
    any-file: &function
      - internal/provider/function_!(*_test.go)
      - docs/functions/**
      - examples/functions/**
  - title: '^feat\((provider::sentry::|functions?)[^)]*\)!?:'

'fix: resource':
  - title: *fix
    any-file: *resource
  - title: &fix-res '^fix\((resource|sentry_)[^)]*\)!?:'

'fix: data source':
  - title: *fix
    any-file: *data-source
  - title: &fix-ds '^fix\(data[-_]source[^)]*\)!?:'

# Both: one matcher can hold only one any-file, so the second goes through a double not.
'fix: resource + data source':
  - title: *fix
    any-file: *resource
    not:
      not:
        any-file: *data-source
  - title: *fix-res
    any-file: *data-source
  - title: *fix-ds
    any-file: *resource

'fix: ephemeral resource':
  - title: *fix
    any-file: *ephemeral-resource
  - title: '^fix\(ephemeral[-_]resource[^)]*\)!?:'

'fix: function':
  - title: *fix
    any-file: *function
  - title: '^fix\((provider::sentry::|functions?)[^)]*\)!?:'
