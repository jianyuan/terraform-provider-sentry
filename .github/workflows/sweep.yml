# Deletes resources leaked by acceptance tests so they don't exhaust organization limits.
name: Sweep

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

# Shared with the acceptance tests so a sweep never deletes resources from a run in progress.
concurrency:
  group: sentry-test-org-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache-dependency-path: "go.sum"
      - run: go mod download
      - env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_TEST_ORGANIZATION: ${{ secrets.SENTRY_TEST_ORGANIZATION }}
        run: make sweep SWEEPARGS=-sweep-allow-failures SWEEP_TIMEOUT=25m
